<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учебный перевод с латинского языка: Нептун и Меркурий</title>
<meta name="author" content="Magistra MS">
<meta name="description" content="Учебный перевод с латинского языка: определение формы (время, число, падеж) и перевод. Автор: Magistra MS.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>/* Latin exercise — Magistra MS */
:root{
  --bg:#f5eedd; --card:#fffaf0; --ink:#2b2118; --muted:#6f6350; --line:#e3d6b8;
  --terra:#b4492f; --blue:#2f6fa8; --green:#3d7f46; --gold:#b98512; --good:#2f8a4e; --bad:#c0392b;
  --r-p:#b4492f; --r-s:#2f6fa8; --r-o:#3d7f46; --r-r:#b98512;
  --serif:'Spectral',Georgia,'Times New Roman',serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 20% 0%,#fbf4e2 0,transparent 55%)}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.meander{height:12px;background:
  linear-gradient(90deg,var(--terra) 0 0) 0 0/100% 2px no-repeat,
  repeating-linear-gradient(90deg,var(--terra) 0 3px,transparent 3px 6px) 0 4px/100% 6px no-repeat;opacity:.8}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,250,240,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font:500 11px var(--sans);color:var(--muted);letter-spacing:.3px}
.dots{display:flex;gap:5px;flex:1;min-width:140px;flex-wrap:wrap}
.dot{width:22px;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:default}
.dot.done{background:var(--good)} .dot.part{background:#d9a21b} .dot.cur{outline:2px solid var(--terra);outline-offset:1px}
.dot.nav{cursor:pointer}
.pill{font:600 13px var(--sans);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}

/* layout */
main{padding:20px 0 60px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 0 #fff inset,0 6px 18px -12px rgba(80,50,10,.35)}
.scene{padding:0;overflow:hidden;position:relative;aspect-ratio:16/9;background:#dcecf8}
.scene svg{width:100%;height:100%;display:block}
.replay{position:absolute;right:10px;bottom:10px;border:1px solid var(--line);background:rgba(255,250,240,.95);border-radius:999px;padding:5px 12px;font:600 13px var(--sans);cursor:pointer}
.snum{font:600 12px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 6px}
.latin{font-family:var(--serif);font-size:clamp(22px,3.4vw,30px);line-height:1.5;margin:0}
.tok{padding:1px 3px;border-radius:5px;transition:background .3s,box-shadow .3s}
.tok.p{background:#f6d5cb;box-shadow:inset 0 -2px 0 var(--r-p)} .tok.s{background:#cfe1f3;box-shadow:inset 0 -2px 0 var(--r-s)}
.tok.o{background:#d3ebd6;box-shadow:inset 0 -2px 0 var(--r-o)} .tok.r{background:#f4e4b6;box-shadow:inset 0 -2px 0 var(--r-r)}
.tok.hl{outline:2px solid var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--terra)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.primary:hover{filter:brightness(1.07)} .btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{padding:13px 24px;font-size:17px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f1a98e;outline-offset:2px}
.dict{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.dict table{width:100%;border-collapse:collapse;font-size:14.5px}
.dict td{padding:6px 8px;border-bottom:1px solid #f0e6cc;vertical-align:top}
.dict td:first-child{font-family:var(--serif);font-weight:700;white-space:nowrap}
.dict tr:hover{background:#fbf0d6}
.dict i{color:var(--muted);font-size:13px}

/* steps */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.step{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px}
.step.locked{opacity:.5;background:#f3ead4}
.step h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
.step .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:13px}
.step.p .n{background:var(--r-p)} .step.s .n{background:var(--r-s)} .step.o .n{background:var(--r-o)} .step.r .n{background:var(--r-r)}
.step .hint{color:var(--muted);font-size:13.5px;margin:0 0 8px}
.step input[type=text]{width:100%;padding:10px 12px;border:1.5px solid #d8c9a3;border-radius:10px;background:#fff;font-size:16px}
.fb{margin-top:8px;font-size:14.5px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font:700 12.5px var(--sans);color:#fff}
.chip.good{background:var(--good)} .chip.mid{background:#d08a10} .chip.bad{background:var(--bad)}
.exp{background:#f6efd9;border-radius:8px;padding:6px 10px;margin-top:6px}
.sdone{margin-top:14px}
.sdone .ref{font-family:var(--serif);font-size:19px}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--terra);color:#fff;font:700 22px var(--serif)}

/* intro / results */
.hero{text-align:center;padding:26px 14px}
.hero h1{font-family:var(--serif);font-size:clamp(28px,5vw,44px);margin:6px 0 4px;line-height:1.15}
.hero .sub{color:var(--muted);max-width:640px;margin:0 auto 14px}
.rules{text-align:left;max-width:720px;margin:14px auto;padding-left:20px}
.rules li{margin:6px 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.choice{border:2px solid var(--line);border-radius:16px;background:#fff;padding:16px;text-align:left;cursor:pointer}
.choice:hover{border-color:var(--terra)} .choice h3{margin:0 0 4px;font-family:var(--serif);font-size:21px}
.choice .meta{color:var(--muted);font-size:14px}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.legend span{padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.ticket{border:2px solid var(--terra);border-radius:18px;background:#fffdf6;padding:18px;position:relative}
.ticket .code{font:700 clamp(15px,3.2vw,22px) ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.5px;background:#f6efd9;border-radius:10px;padding:8px 12px;display:inline-block;word-break:break-all}
.bigmark{font:700 64px/1 var(--serif);color:var(--terra)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.kv div{background:#f6efd9;border-radius:10px;padding:8px 12px}
.kv b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.nameinp{width:100%;font:700 24px var(--serif);padding:10px 14px;border:2px dashed var(--terra);border-radius:12px;background:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:10px 0}
.sg{border-radius:10px;padding:6px;text-align:center;font-size:13px;border:1px solid var(--line);background:#fff}
.sg b{display:block;font-size:16px}
.list{margin:6px 0;padding-left:18px} .list li{margin:5px 0}
details summary{cursor:pointer;font-weight:600}
.author{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.modal{position:fixed;inset:0;background:rgba(40,25,10,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:520px;width:100%}
.modal input{width:100%;padding:10px;border:1.5px solid #d8c9a3;border-radius:10px;font:600 16px ui-monospace,Menlo,monospace}
[hidden]{display:none!important}

/* ---------- анимации сцен ---------- */
.a-bob{animation:s-bob var(--d,2s) ease-in-out var(--delay,0s) infinite alternate}
.a-bob2{animation:s-bob2 var(--d,2s) ease-in-out var(--delay,0s) infinite alternate}
.a-sway{animation:s-sway var(--d,4s) ease-in-out var(--delay,0s) infinite alternate}
.a-drift{animation:s-drift var(--d,14s) ease-in-out infinite alternate}
.a-wave{animation:s-wave var(--d,4s) linear infinite}
.a-flick{animation:s-flick var(--d,.5s) ease-in-out infinite alternate}
.a-twinkle{animation:s-twinkle var(--d,1.6s) ease-in-out var(--delay,0s) infinite alternate}
.a-rise{animation:s-rise var(--d,3s) ease-out var(--delay,0s) infinite}
.a-flap{animation:s-flap var(--d,.5s) ease-in-out var(--delay,0s) infinite alternate}
.a-arm{animation:s-arm 1s ease-in-out var(--delay,0s) infinite alternate}
.a-pulse{animation:s-pulse var(--d,2.6s) ease-in-out infinite alternate}
.a-spin{animation:s-spin var(--d,24s) linear infinite}
.a-move{animation:s-move var(--d,5s) ease-in-out var(--delay,0s) infinite alternate}
.a-walk{animation:s-walk var(--d,6s) linear var(--delay,0s) infinite}
.a-leg{animation:s-leg var(--d,.7s) ease-in-out var(--delay,0s) infinite alternate}
.a-jump{animation:s-jump var(--d,.9s) ease-in-out infinite alternate}
.a-dash path{stroke-dashoffset:0;animation:s-dash var(--d,1.2s) linear infinite}
.a-fan{animation:s-fan var(--d,2.4s) ease-in-out infinite alternate}
.a-pop{animation:s-pop .5s ease-out var(--delay,0s) both}
.a-drop{animation:s-drop var(--d,5s) ease-in infinite}
.a-grow{animation:s-grow var(--d,5s) ease-out infinite}
.a-thrust{animation:s-thrust var(--d,.9s) ease-in-out infinite alternate}
.a-shake{animation:s-shake var(--d,.9s) linear infinite}
.a-write{animation:s-write var(--d,4s) linear var(--delay,0s) infinite}
.a-fade{animation:s-fade var(--d,3s) ease-in-out var(--delay,0s) infinite alternate}
.a-fall{animation:s-fall var(--d,5s) linear var(--delay,0s) infinite}
.a-ring{animation:s-ring var(--d,2.4s) ease-out var(--delay,0s) infinite}
@keyframes s-bob{to{transform:translateY(-3px)}}
@keyframes s-bob2{to{transform:translateY(-9px)}}
@keyframes s-sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes s-drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes s-wave{to{transform:translateX(calc(-1*var(--per,60px)))}}
@keyframes s-flick{to{transform:scale(.9,1.14)}}
@keyframes s-twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.1)}}
@keyframes s-rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-55px);opacity:0}}
@keyframes s-flap{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes s-arm{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes s-pulse{to{transform:scale(1.12)}}
@keyframes s-spin{to{transform:rotate(360deg)}}
@keyframes s-move{from{transform:translate(var(--x0,0),var(--y0,0))}to{transform:translate(var(--x1,0),var(--y1,0))}}
@keyframes s-walk{0%{transform:translate(var(--x0,0),var(--y0,0));opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(var(--x1,0),var(--y1,0));opacity:0}}
@keyframes s-leg{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes s-jump{to{transform:translateY(-9px)}}
@keyframes s-dash{to{stroke-dashoffset:-30}}
@keyframes s-fan{from{transform:scale(.8)}to{transform:scale(1.05)}}
@keyframes s-pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes s-drop{0%{transform:translateY(-110px);opacity:0}25%{transform:translateY(0);opacity:1}88%{opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes s-grow{0%{transform:scaleY(.15);opacity:.3}30%{transform:scaleY(1);opacity:1}90%{opacity:1}100%{transform:scaleY(1);opacity:.3}}
@keyframes s-thrust{to{transform:translateX(30px)}}
@keyframes s-shake{0%,50%,100%{transform:translateX(0)}20%{transform:translateX(3px)}70%{transform:translateX(-3px)}}
@keyframes s-write{0%{opacity:0}20%,85%{opacity:1}100%{opacity:0}}
@keyframes s-fade{from{opacity:.25}to{opacity:1}}
@keyframes s-fall{from{transform:translateY(0) translateX(0)}to{transform:translateY(260px) translateX(30px)}}
@keyframes s-ring{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(34px)}}
@media (prefers-reduced-motion:reduce){.scene *{animation-duration:30s!important}}

/* v3: вопросы, схема, компактный итог */
.ql{display:block;margin:10px 0 0;font-weight:600;font-size:15px}
.ql input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid #d8c9a3;border-radius:10px;background:#fff;font-size:16px;font-weight:400}
.lat{font-family:var(--serif);color:var(--r-r);font-weight:600}
.scheme{margin-top:14px;border:1px dashed var(--terra);border-radius:14px;padding:12px 14px;background:#fffdf6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sc{background:#f6efd9;border-radius:10px;padding:5px 10px}.sc small{display:block;color:var(--muted);font-size:11.5px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.rcol{display:grid;gap:14px}
@media(max-width:860px){.rgrid{grid-template-columns:1fr}}
.list.cols{columns:2;column-gap:28px}.list.cols li{break-inside:avoid}
@media(max-width:860px){.list.cols{columns:1}}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}.sg{padding:3px;font-size:11px}.sg b{font-size:14px}
.menu{display:grid;gap:16px;margin:20px 0}
.menu a{text-decoration:none;color:inherit}
.step.m .n{background:var(--r-r)}

/* v4: выбор формы */
.sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sel label{font-size:13px;font-weight:600;color:var(--muted)}
.sel select{display:block;width:100%;margin-top:3px;padding:9px 8px;border:1.5px solid #d8c9a3;border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}
@media(max-width:420px){.sel{grid-template-columns:1fr}}
.mi{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}.mi:first-of-type{border-top:0;padding-top:0}
.fb .mi{margin-top:8px}
.brand{font-size:16px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<script>/* scenes.js — анимированные SVG-сцены к предложениям. Автор проекта: Magistra MS */
(function () {
  const C = { ink: '#2b2118', skin: '#f1c69c', marble: '#ece7da', marble2: '#cfc8b8', gold: '#d9a21b', terra: '#b4492f' };
  let _u = 0; const uid = () => 'u' + (++_u);
  const at = (x, y, s, inner, flip) => `<g transform="translate(${x},${y}) scale(${flip ? -(s || 1) : (s || 1)},${s || 1})">${inner}</g>`;
  const A = (cls, inner, d, delay, extra) => `<g class="${cls}" style="--d:${d || 2}s;--delay:${delay || 0}s;${extra || ''}">${inner}</g>`;
  const mv = (inner, x0, y0, x1, y1, d, delay, cls) => A(cls || 'a-move', inner, d, delay, `--x0:${x0}px;--y0:${y0}px;--x1:${x1}px;--y1:${y1}px`);

  /* ---------- фоны ---------- */
  const sky = (a, b) => { const i = uid(); return `<defs><linearGradient id="${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="480" height="270" fill="url(#${i})"/>`; };
  const cloud = (x, y, s, d, fill, op) => at(x, y, s || 1, A('a-drift', `<g fill="${fill || '#fff'}" opacity="${op || .95}"><ellipse rx="34" ry="12"/><circle cx="-14" cy="-8" r="13"/><circle cx="8" cy="-13" r="16"/><circle cx="24" cy="-4" r="11"/></g>`, d || 14));
  const sun = (x, y, r) => { r = r || 22; return at(x, y, 1, A('a-spin', Array.from({ length: 12 }, (_, i) => `<rect x="-2" y="${-r - 14}" width="4" height="10" rx="2" fill="#f6c945" transform="rotate(${i * 30})"/>`).join(''), 24) + `<circle r="${r}" fill="#f9d95a"/>`); };
  const wave = (y, fill, amp, per, d, op, rev) => { amp = amp || 5; per = per || 60; let p = `M${-per * 2},${y}`; for (let x = -per * 2; x < 480 + per; x += per) p += ` q${per / 4},${-amp} ${per / 2},0 t${per / 2},0`; p += ` V270 H${-per * 2} Z`; return `<g class="a-wave" style="--per:${per}px;--d:${d || 4}s;${rev ? 'animation-direction:reverse;' : ''}"><path d="${p}" fill="${fill}" opacity="${op || 1}"/></g>`; };
  const hills = (c1, c2) => `<path d="M0,190 Q90,150 190,185 T380,175 T480,170 V270 H0Z" fill="${c2 || '#7fae57'}"/><path d="M0,218 Q120,190 240,214 T480,206 V270 H0Z" fill="${c1 || '#9bc36b'}"/>`;
  const tree = (x, y, s, k, d, delay) => at(x, y, s || 1, `<rect x="-3" y="-26" width="6" height="26" fill="#7a5230"/>` + A('a-sway', k === 'pine' ? `<path d="M0,-74 L-17,-30 H17Z M0,-58 L-22,-16 H22Z" fill="#2f6b3c"/>` : `<circle cy="-38" r="18" fill="#6f9a4a"/><circle cx="-12" cy="-28" r="12" fill="#7fae57"/><circle cx="12" cy="-30" r="12" fill="#5d8a3e"/>`, d || 4, delay || 0));
  const house = (x, y, s) => at(x, y, s || 1, `<rect x="-16" y="-24" width="32" height="24" fill="#f0e2c0"/><path d="M-20,-24 L0,-42 L20,-24Z" fill="#c8623f"/><rect x="-4" y="-14" width="8" height="14" fill="#8a5a34"/><rect x="7" y="-19" width="6" height="6" fill="#7fb6d9"/>`);
  const spark = (x, y, s, delay) => at(x, y, s || 1, A('a-twinkle', `<path d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6Z" fill="#fff3a0" stroke="#e6b422" stroke-width=".6"/>`, 1.6, delay || 0));
  const heart = (x, y, delay, s) => at(x, y, s || 1, A('a-rise', `<path d="M0,4 C-10,-4 -5,-11 0,-6 C5,-11 10,-4 0,4Z" fill="#e8517f"/>`, 3, delay || 0));
  const note = (x, y, delay) => at(x, y, 1, A('a-rise', `<ellipse rx="4.2" ry="3" transform="rotate(-20)" fill="${C.ink}"/><path d="M3.6,-1.5 V-16 q7,1 6,9" stroke="${C.ink}" stroke-width="1.8" fill="none"/>`, 3, delay || 0));
  const bubble = (x, y, r, delay) => at(x, y, 1, A('a-rise', `<circle r="${r}" fill="none" stroke="#e8f8ff" stroke-width="1.4" opacity=".9"/>`, 3.5, delay || 0));
  const tag = (x, y, txt, delay) => { const w = txt.length * 6.8 + 18; return at(x, y, 1, A('a-pop', `<rect x="${-w / 2}" y="-11" width="${w}" height="20" rx="10" fill="#fbf5e6" stroke="#b4492f" stroke-width="1.4"/><text y="3.5" text-anchor="middle" font-family="Spectral,Georgia,serif" font-style="italic" font-size="12.5" fill="#2b2118">${txt}</text>`, 0.5, delay || 0)); };
  const flame = (x, y, s) => at(x, y, s || 1, A('a-flick', `<path d="M0,0 C-9,-4 -8,-16 0,-26 C2,-16 9,-12 8,-5 C7,-1 3,1 0,0Z" fill="#f08a24"/><path d="M0,0 C-4,-2 -4,-9 0,-14 C2,-9 5,-6 3,-2Z" fill="#ffd44d"/>`, .5));

<script>/* app.js — логика учебного перевода. Автор проекта: Magistra MS */

  /* ---------- утилиты ---------- */
  const r2 = n => Math.round(n * 100) / 100;

  /* ---------- слайды и баллы ---------- */
  function slides() { const out = [{ k: 'intro' }]; if (state.plan.length) { TEXTS[0].sents.forEach((_, i) => out.push({ k: 's', t: 0, i })); out.push({ k: 'res', t: 0 }); } return out; }
  const ansOf = i => (state.texts[TEXTS[0].id] || { ans: {} }).ans[i] || {};

      S.k.m.forEach((q, j) => { const it = m.items[j] || { t: 0, f: 0, text: '', fa: '', fb: '' }; items(i, q.q + ' (' + q.lat + ')', q, it, 1 / nm, false); });

  function review(sm) {

  /* ---------- код и очередь ---------- */
  function makeCode(pts) {
    const d = new Date(), ts = String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
    let rnd; try { rnd = Array.from(crypto.getRandomValues(new Uint8Array(3))).map(b => b.toString(36).toUpperCase().padStart(2, '0')).join('').slice(0, 4); } catch (e) { rnd = Math.random().toString(36).slice(2, 6).toUpperCase(); }

  }
  function checkCode(code) {

  }
  function drawIntro() {

    root.innerHTML = `<div class="wrap" style="max-width:640px"><div class="card hero">
      <div class="snum">${TITLE}</div>

  }
  const opts = (list, extra) => '<option value="">— выберите —</option>' + list.concat(extra || []).map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('');

    return `<div><span class="chip ${chipCls(r.score)}">${fmt(r.score)} / 1</span></div>

  function keyHtml(S) {

  }
  function drawWork(cur) {
    const S = TEXTS[0].sents[cur.i], a = ansOf(cur.i), active = STEPS.findIndex(s => !a[s.key]);
    const li = STEPS.map((st, idx) => {
      const r = a[st.key], cls = st.key + (r ? '' : idx === active ? '' : ' locked'); let body = '', title = st.title;
      if (st.key === 'o' && S.k.o.nom) title = 'Кем был(а)? — именная часть сказуемого';
      if (r && st.key !== 'm') body = `<div class="fb">${fb(r)}</div>`;
      else if (r) body = '<div class="fb">' + S.k.m.map((q, j) => `<div class="mi"><div><b>${esc(q.q)}</b> <i class="lat">(${esc(q.lat)})</i></div>${fb(r.items[j])}</div>`).join('') + '</div>';
      else if (idx === active && st.key === 'm') body = `<p class="hint">${esc(st.hint)}</p>` + S.k.m.map((q, j) => `<div class="mi"><label class="ql">${esc(q.q)} <i class="lat">(${esc(q.lat)})</i><input type="text" class="minp" data-j="${j}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="перевод"></label>${selects('m', 'ms', j)}</div>`).join('') + '<div class="row"><button class="btn primary" data-checkm="1">Проверить</button></div>';
      else if (idx === active) body = `<p class="hint">${esc(S.k[st.key].nom ? 'Впишите перевод именной части (только само слово) и определите латинскую форму.' : st.hint)}</p><input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(st.ph)}" aria-label="${esc(title)}">${selects(st.key === 'p' ? 'p' : 'n', 'fs')}<div class="row"><button class="btn primary" data-check="${st.key}">Проверить</button>${st.key === 'o' ? '<button class="btn" data-none="o">Дополнения нет</button>' : ''}</div>`;
      return `<li class="step ${cls}"><h3><span class="n">${idx + 1}</span>${esc(title)}</h3>${body}</li>`;
    }).join('');
    let done = '';
    if (active === -1) {
      const pts = sentPts(cur.i), m = markOf(pts / 4 * 100), last = cur.i === TEXTS[0].sents.length - 1;
      done = `<div class="card sdone"><div class="row" style="margin:0 0 8px"><span class="mark">${m}</span><div><b>Предложение ${cur.i + 1}: ${fmt(pts)} из 4 баллов</b><br><span style="color:var(--muted)">${markWord(m)}</span></div></div><div class="ref">${esc(S.ref)}</div>${keyHtml(S)}<div class="row"><button class="btn primary big" data-next="1">${last ? 'К результатам →' : 'Следующее предложение →'}</button></div></div>`;
    }
    $('#work').innerHTML = `<ol class="steps">${li}</ol>${scheme(S, a)}${done}`;
    const inp = $('#inp') || $('.minp'); if (inp && (cur.i || Object.keys(a).length)) inp.focus({ preventScroll: true });
    if ($('#inp')) $('#inp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(cur, STEPS[active].key, false); } });
  }
  const val = s => { const e = $(s); return e ? e.value : ''; };
  function ans(cur) { const id = TEXTS[0].id; return state.texts[id].ans[cur.i] = state.texts[id].ans[cur.i] || {}; }
  function after(cur) { save(); drawTop(cur); drawSentence(cur); const t = $('#timer'), tx = state.texts[TEXTS[0].id]; if (t) t.textContent = '⏱ ' + fmtDur(Date.now() - tx.start); }
  function check(cur, key, none) {
    const S = TEXTS[0].sents[cur.i], a = ans(cur); if (a[key]) return;
    a[key] = scoreCore(S, key, none ? '' : val('#inp'), none, val('.fs-a'), val('.fs-b')); after(cur);
  }
  function checkM(cur) {
    const S = TEXTS[0].sents[cur.i], a = ans(cur); if (a.m) return;
    const items = S.k.m.map((q, j) => scoreSub(q, val(`.minp[data-j="${j}"]`), val(`.ms-a[data-j="${j}"]`), val(`.ms-b[data-j="${j}"]`)));
    a.m = { items, score: r2(items.reduce((n, x) => n + x.score, 0) / items.length) }; after(cur);
  }

  /* ---------- итоговый слайд ---------- */
  function drawResult() {
    const T = TEXTS[0], R = state.res, tx = state.texts[T.id], sm = summary();
    const queueLbl = R.qsrc === 'global' ? 'Номер в очереди' : 'Номер сдачи (на этом устройстве)', queueTxt = R.q == null ? '…' : '№ ' + R.q;
    const topics = Object.keys(sm.topicLoss).sort((a, b) => sm.topicLoss[b] - sm.topicLoss[a]).slice(0, 5);
    root.innerHTML = `<div class="wrap" style="max-width:1100px"><div class="rgrid">
      <div class="ticket"><div class="snum">${TITLE} · «${esc(T.ru)}»</div>
        <label class="snum" for="nm" style="margin-top:8px">Впишите имя и фамилию</label>
        <input id="nm" class="nameinp" type="text" value="${esc(state.name)}" placeholder="Имя Фамилия" autocomplete="name">
        <div class="row" style="margin-top:14px;gap:18px"><div class="bigmark">${sm.mark}</div><div><b style="font-size:20px">${fmt(sm.pts)} из ${sm.max} баллов</b> · ${Math.round(sm.pct)}%<br><span style="color:var(--muted)">${markWord(sm.mark)}</span></div></div>
        <div class="kv"><div><b>Перевод</b>${Math.round(sm.trAcc * 100)}% верно</div><div><b>Форма: время, число, падеж</b>${Math.round(sm.foAcc * 100)}% верно</div><div><b>Сдано</b>${fmtDate(R.at)}</div><div><b>Время выполнения</b>${fmtDur(R.at - tx.start)}</div><div><b>${queueLbl}</b>${queueTxt}</div><div><b>Попытка</b>№ ${state.attempt}</div></div>
        <div class="snum">Уникальный код</div><div class="code">${esc(R.code)}</div>
        <div class="sgrid">${sm.per.map((p, i) => `<div class="sg"><span style="color:var(--muted)">№${i + 1}</span><b>${fmt(p)}</b></div>`).join('')}</div></div>
      <div class="rcol"><div class="card"><b>Отзыв</b><p style="margin:6px 0 0">${esc(review(sm))}</p></div>
        <div class="card"><b>Рекомендации</b>${topics.length ? `<ul class="list">${topics.map(t => `<li><b>${esc(TOPICS[t][0])}.</b> ${esc(TOPICS[t][1])}</li>`).join('')}</ul>` : '<p style="margin:6px 0 0">Ошибок нет. Попробуйте другой учебный перевод без подсказок словаря.</p>'}</div></div></div>
      <div class="card" style="margin-top:14px"><b>Ошибки (${sm.errors.length})</b>${sm.errors.length ? `<ul class="list cols">${sm.errors.map(e => `<li><b>Предл. ${e.i}. ${esc(e.step)}:</b> ${esc(e.got)} → <b>${esc(e.ref)}</b> <span style="color:var(--muted)">(−${fmt(e.lost)})</span></li>`).join('')}</ul>` : '<p style="margin:6px 0 0">Ошибок нет.</p>'}</div>
      <p class="snum" style="text-align:center;margin-top:14px">Впишите имя, сделайте скриншот этого слайда целиком и отправьте преподавателю</p>
      <p class="author"><button class="btn" id="reset" style="font-size:12px;min-height:28px;padding:2px 10px">Пройти заново</button><br>Автор: ${esc(CFG.author)}</p></div>`;
    $('#nm').addEventListener('input', e => { state.name = e.target.value; save(); });
  }

  /* ---------- события ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return; const cur = slides()[state.pos];
    if (t.dataset.start) { if (state.plan.length && !confirm('Начать заново? Прогресс будет потерян.')) return; const n = state.name; state = fresh(); state.name = n; return start(); }
    if (t.dataset.go != null) return go(+t.dataset.go);
    if (t.dataset.check) return check(cur, t.dataset.check, false);
    if (t.dataset.checkm) return checkM(cur);
    if (t.dataset.none) return check(cur, 'o', true);
    if (t.dataset.next) return cur.i === TEXTS[0].sents.length - 1 ? finish() : go(state.pos + 1);
    if (t.id === 'dbtn') { dictOpen = !dictOpen; $('#dict').hidden = !dictOpen; t.setAttribute('aria-expanded', dictOpen); }
    if (t.id === 'replay') { const svg = $('#scene svg'); if (svg) svg.outerHTML = window.renderScene(TEXTS[0].sents[cur.i].scene); }
    if (t.id === 'reset') { if (confirm('Пройти заново? Текущий результат будет потерян.')) { const n = state.name; state = fresh(); state.name = n; sceneKey = ''; save(); draw(); } }
    if (t.id === 'teach') openTeacher();
  });
  function openTeacher() {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card"><b>Проверка кода результата</b><p style="color:var(--muted);font-size:14px">Вставьте код со скриншота студента (подходит для обоих переводов).</p><input id="cc" placeholder="T1-261119214503-3450-1-3FA9-K7X" autocomplete="off"><p id="cr" style="min-height:48px"></p><div class="row"><button class="btn primary" id="cb">Проверить</button><button class="btn" id="cx">Закрыть</button></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', ev => { if (ev.target === m || ev.target.id === 'cx') m.remove(); if (ev.target.id === 'cb') { const r = checkCode($('#cc').value), c = $('#cr'); c.textContent = (r.ok ? '✓ ' : '✗ ') + r.msg; c.style.color = r.ok ? 'var(--good)' : 'var(--bad)'; } });
    $('#cc').focus();
  }
  if (state.pos >= slides().length) state.pos = 0;
  draw();
  window.__latin = { scoreCore, scoreSub, summary, checkCode, state: () => state };
})();
</script>
</body>
</html>
